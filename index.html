<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수원교회 초등부</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <img src="/suwon_logo.png" height="50" alt="Logo" style="display: block;" />
      </div>
      <div class="loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // ℹ️ Keys must match `themeConfig.app.title` in themeConfig.js
    const APP_TITLE = '수원교회 초등부'

    // 🧹 Remove stale keys from the original template title so old purple values don't leak in
    ;['Materio-initial-loader-bg', 'Materio-initial-loader-color'].forEach(k => localStorage.removeItem(k))

    const loaderColor = localStorage.getItem(`${APP_TITLE}-initial-loader-bg`) || '#FFFFFF'
    const primaryColor = localStorage.getItem(`${APP_TITLE}-initial-loader-color`) || '#003678'

    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
    if (primaryColor)
      document.documentElement.style.setProperty('--initial-loader-color', primaryColor)

  </script>
</body>

</html>
