server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 업로드/요청 본문 여유
    client_max_body_size 10m;

    # Docker 내장 DNS.
    # 기동 시점에 backend 를 resolve 하지 않고 요청 시점으로 미루기 위해 필요합니다.
    # (이게 없으면 backend 가 없는 목업 컨테이너에서 nginx 가 아예 기동하지 못합니다)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 컨테이너 healthcheck / 배포 검증용
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API 프록시 ──────────────────────────────────────────────
    # ^~ 를 붙여야 아래 정규식 location(.js|.json 등)이 /api 요청을 가로채지 않습니다.
    # 백엔드는 /auth, /apps/users, /apps/attendance 를 루트에 마운트하므로
    # /api 접두어를 떼고 넘깁니다.  예) /api/auth/login -> backend:4000/auth/login
    location ^~ /api/ {
        set $api_upstream backend:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # API 응답은 절대 캐시하지 않습니다.
        add_header Cache-Control "no-store" always;
    }

    # index.html 은 캐시하지 않습니다.
    # 캐시되면 브라우저가 옛 에셋 해시를 계속 참조해서 배포해도 화면이 바뀌지 않습니다.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite 가 파일명에 콘텐츠 해시를 넣으므로 에셋은 길게 캐시해도 안전합니다.
    # expires 지시자와 함께 쓰면 Cache-Control 이 중복 헤더로 나가므로 add_header 만 씁니다.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 넘깁니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
